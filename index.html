var G=null, call=null;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- voice changer (pitch shift, "Jungle" delay-line algorithm) ---------- */
function phoneCurve(){
  var n=512,c=new Float32Array(n);
  for(var i=0;i<n;i++){var x=i*2/(n-1)-1,y=Math.tanh(x*1.2)/1.2;c[i]=Math.round(y*128)/128;}
  return c;
}
function Jungle(ctx){
  var bufferTime=0.100, fadeTime=0.050, delayTime=0.100, self=this;
  function fadeBuf(){
    var l1=Math.round(bufferTime*ctx.sampleRate), l2=Math.round((bufferTime-2*fadeTime)*ctx.sampleRate), len=l1+l2;
    var b=ctx.createBuffer(1,len,ctx.sampleRate), p=b.getChannelData(0);
    var fl=fadeTime*ctx.sampleRate, i1=fl, i2=l1-fl, i;
    for(i=0;i<l1;i++){p[i]=i<i1?Math.sqrt(i/fl):(i>=i2?Math.sqrt(1-(i-i2)/fl):1);}
    for(i=l1;i<len;i++) p[i]=0;
    return b;
  }
  function delayBuf(up){
    var l1=Math.round(bufferTime*ctx.sampleRate), l2=Math.round((bufferTime-2*fadeTime)*ctx.sampleRate), len=l1+l2;
    var b=ctx.createBuffer(1,len,ctx.sampleRate), p=b.getChannelData(0), i;
    for(i=0;i<l1;i++) p[i]=up?(l1-i)/len:i/l1;
    for(i=l1;i<len;i++) p[i]=0;
    return b;
  }
  function src(buf){var s=ctx.createBufferSource();s.buffer=buf;s.loop=true;return s;}
  this.input=ctx.createGain();this.output=ctx.createGain();
  var down=delayBuf(false), up=delayBuf(true);
  var m1=src(down),m2=src(down),m3=src(up),m4=src(up);
  var g1=ctx.createGain(),g2=ctx.createGain(),g3=ctx.createGain(),g4=ctx.createGain();
  g3.gain.value=0;g4.gain.value=0;
  m1.connect(g1);m2.connect(g2);m3.connect(g3);m4.connect(g4);
  var mg1=ctx.createGain(),mg2=ctx.createGain();
  g1.connect(mg1);g2.connect(mg2);g3.connect(mg1);g4.connect(mg2);
  var d1=ctx.createDelay(),d2=ctx.createDelay();
  mg1.connect(d1.delayTime);mg2.connect(d2.delayTime);
  var f1=src(fadeBuf()),f2=src(fadeBuf());
  var x1=ctx.createGain(),x2=ctx.createGain();x1.gain.value=0;x2.gain.value=0;
  f1.connect(x1.gain);f2.connect(x2.gain);
  this.input.connect(d1);this.input.connect(d2);
  d1.connect(x1);d2.connect(x2);x1.connect(this.output);x2.connect(this.output);
  var t=ctx.currentTime+0.05, t2=t+bufferTime-fadeTime;
  m1.start(t);m2.start(t2);m3.start(t);m4.start(t2);f1.start(t);f2.start(t2);
  function setDelay(d){mg1.gain.setTargetAtTime(0.5*d,0,0.010);mg2.gain.setTargetAtTime(0.5*d,0,0.010);}
  this.setPitchOffset=function(mult){
    if(mult>0){g1.gain.value=0;g2.gain.value=0;g3.gain.value=1;g4.gain.value=1;}
    else{g1.gain.value=1;g2.gain.value=1;g3.gain.value=0;g4.gain.value=0;}
    setDelay(delayTime*Math.abs(mult));
  };
  this.setPitchOffset(0);
}

/* ---------- people ---------- */
function getPlayers(){
  if(!room) return [];
  var seen={}, out=[];
  room.peers().forEach(function(p){
    if(p.kind!=="viewer"||!p.presence||!p.presence.name) return;
    if(seen[p.peer]) return; seen[p.peer]=1;
    out.push({peer:p.peer,name:String(p.presence.name).slice(0,16),color:String(p.presence.color||COLORS[0]),
      host:!!p.presence.host,phase:p.presence.phase});
  });
  out.sort(function(a,b){return a.peer<b.peer?-1:1;});
  return out;
}
function hostPeer(){var h=getPlayers().filter(function(p){return p.host;})[0];return h?h.peer:null;}
function isHost(){return myPeer&&hostPeer()===myPeer;}
function isAlive(id){return getPlayers().some(function(p){return p.peer===id;});}
function alivePlayers(){return G?G.players.filter(function(p){return isAlive(p.peer);}):[];}
function nameOf(id){
  var p=(G&&G.players.filter(function(x){return x.peer===id;})[0])||getPlayers().filter(function(x){return x.peer===id;})[0];
  return p?p.name:"Игрок";
}

/* ---------- network: PeerJS mesh ---------- */
var routes={}, peerObj=null, conns={}, pending={}, remotePres={}, myPres={}, audios={}, handlers={}, peerCbs=[], hostId="";
function bcast(obj){Object.keys(conns).forEach(function(id){if(conns[id].open){try{conns[id].send(obj);}catch(e){}}});}
function notifyPeers(){peerCbs.forEach(function(f){try{f();}catch(e){console.error(e);}});}
function deliver(topic,msg){(handlers[topic]||[]).forEach(function(f){try{f(msg);}catch(e){console.error(e);}});}
var roomShim={
  peers:function(){
    var a=[{peer:myPeer,kind:"viewer",presence:myPres,isMe:true}];
    Object.keys(conns).forEach(function(id){
      if(conns[id].open&&remotePres[id]) a.push({peer:id,kind:"viewer",presence:remotePres[id],isMe:false});
    });
    return a;
  },
  emit:function(topic,data){
    bcast({t:"ev",topic:topic,data:data});
    setTimeout(function(){deliver(topic,{topic:topic,data:data,peer:myPeer,isMe:true});},0);
    return Promise.resolve();
  },
  on:function(topic,fn){(handlers[topic]=handlers[topic]||[]).push(fn);},
  presence:function(patch){
    var np={};Object.keys(myPres).forEach(function(k){np[k]=myPres[k];});
    Object.keys(patch).forEach(function(k){np[k]=patch[k];});
    myPres=np;bcast({t:"pres",pres:myPres});notifyPeers();return Promise.resolve();
  },
  onPeers:function(fn){peerCbs.push(fn);}
};
function setupConn(conn){
  var id=conn.peer;

/* ---------- game flow ---------- */
function curMode(){return MODES[PLAN[G.round]]||MODES.whose;}
function resetRound(g){
  var m=MODES[PLAN[g.round]]||MODES.whose;
  g.introEnd=Date.now()+INTRO_SEC*1000;
  g.endAt=g.introEnd+m.secs*1000;
  g.submitted=false;g.notes={};g.panel="none";g.guesses={};g.gain={};g.hits={};g.right={};
}
function newGame(players,rooms,pitch,useFx){
  var g={players:players,rooms:rooms,pitch:pitch,useFx:useFx,round:0,total:{}};
  players.forEach(function(p){g.total[p.peer]=0;});
  resetRound(g);
  return g;
}
function inRound(){return !!G&&(S.view==="game"||S.view==="intro");}
function assign(ps,fx){
  var nums=shuffle(ps.map(function(_,i){return i+1;}));
  var pool=shuffle([-0.5,-0.3,0.3,0.5,0.4,-0.4]);
  var rooms={},pitch={};
  ps.forEach(function(p,i){rooms[p.peer]=nums[i];pitch[p.peer]=fx?pool[i]:0;});
  return {rooms:rooms,pitch:pitch};
}
function myRoom(){return G.rooms[myPeer];}
function peerOfRoom(n){var r=null;Object.keys(G.rooms).forEach(function(id){if(G.rooms[id]===n) r=id;});return r;}
function otherRooms(){
  return G.players.filter(function(p){return p.peer!==myPeer;}).map(function(p){return G.rooms[p.peer];}).sort(function(a,b){return a-b;});
}
function onCtl(m){
  var d=m.data||{}, t=d.t;
  if(m.peer!==hostPeer()) return;
  if(t==="start"){
    if(!Array.isArray(d.players)||!d.rooms||!d.pitch) return;
    var known=getPlayers();
    var pl=d.players.map(function(id){return known.filter(function(p){return p.peer===id;})[0];}).filter(Boolean);
    if(pl.length<2||!d.rooms[myPeer]) return;
    var rooms={},pitch={};
    pl.forEach(function(p){
      rooms[p.peer]=Number(d.rooms[p.peer])||0;
      var x=Number(d.pitch[p.peer])||0;pitch[p.peer]=Math.max(-0.8,Math.min(0.8,x));
    });
    G=newGame(pl,rooms,pitch,!!d.fx);
    enterIntro();
  }else if(t==="next"){

      G.players.forEach(function(p){
        r2[p.peer]=Number(d.rooms[p.peer])||G.rooms[p.peer];
        var x=Number(d.pitch[p.peer])||0;p2[p.peer]=Math.max(-0.8,Math.min(0.8,x));
      });
      G.rooms=r2;G.pitch=p2;
    }
    G.round++;resetRound(G);G.holder0=typeof d.bear==="string"?d.bear:null;
    G.imitId0=typeof d.imit==="string"?d.imit:null;G.pat0=d.pat&&typeof d.pat==="object"?d.pat:null;
    G.chain0=Array.isArray(d.chain)?d.chain.map(String):null;G.phrase0=typeof d.phrase==="string"?d.phrase.slice(0,140):null;

    var hd=d.heard&&typeof d.heard==="object"?d.heard:{}, texts={};
    G.chain.forEach(function(id,k){texts[id]=k===0?G.phrase:String(hd[id]||"").slice(0,140);});
    G.gain={};G.hits={};G.players.forEach(function(p){G.gain[p.peer]=0;G.hits[p.peer]=0;});
    var links=[];
    for(var ci=1;ci<G.chain.length;ci++){
      var fa=G.chain[ci-1], fb=G.chain[ci], sm=textSim(texts[fa],texts[fb]), ok=sm>=0.7;
      links.push({from:fa,to:fb,sim:sm,ok:ok});

    }

    var vt=d.votes&&typeof d.votes==="object"?d.votes:{}, n=G.players.length, im=G.imit.id, votesFor=0, voters=[];
    G.gain={};G.hits={};G.players.forEach(function(p){G.gain[p.peer]=0;});
    Object.keys(vt).forEach(function(v){
      if(vt[v]===im&&v!==im&&G.players.some(function(p){return p.peer===v;})){votesFor++;voters.push(v);G.gain[v]=1;}
    });

    G.imitRes={votesFor:votesFor,voters:voters,wins:wins,n:n};

    S.view="reveal";

    });

    G=null;call=null;stopRing();clearInterval(tickTimer);S.note="";S.view="lobby";setScene("room");
    if(isHost()) room.presence({phase:"lobby"});
  }
  applyAudio();checkProgress();render();
}
function startTick(){
  clearInterval(tickTimer);
  tickTimer=setInterval(function(){
    if(!G) return;
    if(S.view==="intro"){
      var l=Math.max(0,Math.ceil((G.introEnd-Date.now())/1000));
      var e2=document.getElementById("introtm");if(e2) e2.textContent=l;

    var el=document.getElementById("tm");if(el) el.textContent=fmt(left);

    else if(k==="bear"&&left<=0&&isHost()&&!G.endSent){G.endSent=true;room.emit("ctl",{t:"endbear",score:G.bscore});}

      }

      if(isHost()&&!G.endSent){
        var al2=alivePlayers().filter(function(p){return chainPos(p.peer)>0;}), all2=al2.length&&al2.every(function(p){return G.locked[p.peer];});
        if(all2||Date.now()-G.endAt>=2000){G.endSent=true;room.emit("ctl",{t:"endchain",heard:G.heard});}
      }

}
function submitGuess(auto){
  if(!G||G.submitted) return;

  });
  if(!auto){
    if(miss){S.note="Заполните блокнот для всех комнат.";render();return;}
    if(dup){S.note="Один игрок выбран дважды.";render();return;}
  }

function onGuess(m){

  var need=G.players.length-1;

  G.players.forEach(function(p){G.gain[p.peer]=0;G.hits[p.peer]=0;});
  Object.keys(G.guesses).forEach(function(pid){

    G.total[pid]=(G.total[pid]||0)+G.gain[pid];

  if(call){var w=call.with;room.emit("call",{t:"end",to:w});call=null;stopRing();}

function onCall(m){

function hits(x,y){
  if(x<RAD+16||x>WORLD.w-16-RAD||y<RAD+16||y>WORLD.h-16-RAD) return true;
  for(var i=0;i<OBST.length;i++){
    var o=OBST[i];

  }

}

  var dx=((keys.R||pad.R)?1:0)-((keys.L||pad.L)?1:0), dy=((keys.D||pad.D)?1:0)-((keys.U||pad.U)?1:0);

      var e=G.bq[i], q=e.d;

      if(q.seq===b.seq+1){
        G.bq.splice(i,1);
        var okTo=G.players.some(function(p){return p.peer===q.to;});
        var valid=okTo&&((q.t==="give"&&e.from===b.holder&&q.to!==b.holder)||(q.t==="reassign"&&e.from===hostPeer()));
        b.seq=q.seq;
        if(valid){
          if(q.t==="give"){
            G.bscore[q.to]=(G.bscore[q.to]||0)+1;
            b.giver=b.holder;b.receiver=q.to;b.done=true;

function normText(t){return String(t||"").toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();}
function textSim(a,b){
  a=normText(a);b=normText(b);
  if(!a||!b) return 0;
  var m=a.length,n=b.length,prev=[],cur=[],i,j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    prev=cur.slice();
  }
  return Math.max(0,1-prev[n]/Math.max(m,n));
}
function initChain(){

  G.chain=ch;G.phrase=G.phrase0||CHAIN_PHRASES[0];

}
function chainPos(id){return G.chain?G.chain.indexOf(id):-1;}

  if(!t){S.note="Впишите, что вы услышали.";render();return;}

}
function onHeard(m){

  var d=m.data||{};

document.addEventListener("click",function(e){

  if(op&&G&&S.view==="game"){
    var want=op.getAttribute("data-open"), busy=!!call&&call.state!=="in";
    if(G.panel===want){
      if(busy&&want==="phone") S.note="Сначала закончите разговор."; else {G.panel="none";S.note="";}
      render();return;
    }

    S.note="";G.panel=want;render();return;
  }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act");
  if(a==="create") enter(true);
  else if(a==="join") enter(false);

/* ---------- music (generated in the browser, never sent to other players) ---------- */
var music={gain:null,pad:null,arp:null,timer:null,next:0,bar:0};
var TRACKS={
  cozy:{bpm:78,chords:[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,64]],bass:[45,41,36,43],arp:"triangle",pat:[0,2,1,3,2,3,1,2],skip:0.22},
  mystery:{bpm:64,chords:[[50,53,57,62],[46,50,53,58],[55,58,62,67],[57,61,64,69]],bass:[38,46,43,45],arp:"sine",pat:[0,1,2,3,2,1,3,2],skip:0.4}
};
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function tone(type,freq,t,dur,vol,out,att){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.05);
}
function scheduleBar(t,tr,idx){
  var beat=60/tr.bpm, bar=4*beat, ci=idx%tr.chords.length, ch=tr.chords[ci];
  ch.forEach(function(n,i){tone("triangle",mtof(n)*(i%2?1.003:0.997),t,bar+0.3,0.05,music.pad,0.6);});
  tone("sine",mtof(tr.bass[ci]),t,beat*1.8,0.16,music.gain,0.02);
  tone("sine",mtof(tr.bass[ci]),t+2*beat,beat*1.8,0.14,music.gain,0.02);
  for(var i=0;i<8;i++){
    if(Math.random()<tr.skip) continue;
    tone(tr.arp,mtof(ch[tr.pat[i]]+12),t+i*beat/2,beat*1.3,0.05,music.arp,0.01);
  }
}
function musicTick(){
  if(!actx||!music.gain) return;
  var tr=TRACKS[ST.track]||TRACKS.cozy;
  while(music.next<actx.currentTime+2.5){scheduleBar(music.next,tr,music.bar);music.next+=4*60/tr.bpm;music.bar++;}
}
function musicEnsure(){
  if(!actx||!music.gain) return;
  if(ST.music&&!music.timer){music.next=actx.currentTime+0.15;music.bar=0;music.timer=setInterval(musicTick,500);musicTick();}
  else if(!ST.music&&music.timer){clearInterval(music.timer);music.timer=null;}
}
function musicApply(){
  if(!actx||!music.gain) return;
  var game=inRound(), active=!!call&&call.state==="active";
  var duck=(game&&active)?0.3:1;
  music.gain.gain.setTargetAtTime(ST.music?ST.vol*0.6*duck:0,actx.currentTime,0.15);
}
function musicBoot(){
  try{
    if(!actx||music.gain) return;
    music.gain=actx.createGain();music.gain.gain.value=0;music.gain.connect(actx.destination);
    var pf=actx.createBiquadFilter();pf.type="lowpass";pf.frequency.value=1300;pf.connect(music.gain);music.pad=pf;
    var ab=actx.createGain();ab.connect(music.gain);
    var dl=actx.createDelay(1);dl.delayTime.value=0.38;
    var fb=actx.createGain();fb.gain.value=0.32;
    var df=actx.createBiquadFilter();df.type="lowpass";df.frequency.value=1800;
    ab.connect(dl);dl.connect(df);df.connect(fb);fb.connect(dl);df.connect(music.gain);
    music.arp=ab;
    musicEnsure();musicApply();
  }catch(e){music.gain=null;}
}

function testTurn(){
  var out=document.getElementById("turnres");
  if(!window.RTCPeerConnection){out.textContent="Браузер не поддерживает WebRTC.";return;}
  out.textContent="Проверяем, это займёт около 8 секунд…";
  var pc, found=[], errs=[], seen={};
  try{pc=new RTCPeerConnection({iceServers:ICE,iceTransportPolicy:"relay"});}
  catch(e){out.textContent="Не удалось начать проверку: "+e.message;return;}
  pc.createDataChannel("t");
  pc.onicecandidate=function(e){
    if(e.candidate&&/ typ relay /.test(e.candidate.candidate)){
      var m=e.candidate.candidate.split(" "); found.push(m[4]+":"+m[5]+" ("+m[2]+")");
    }
  };
  pc.onicecandidateerror=function(e){
    var t=(e.errorCode||"?")+" "+(e.errorText||"")+(e.url?" ["+e.url+"]":"");
    if(!seen[t]){seen[t]=1;errs.push(t);}
  };
  pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).catch(function(e){errs.push(String(e));});
  setTimeout(function(){
    try{pc.close();}catch(e){}
    if(found.length){
      out.textContent="✓ TURN работает: сервер выдал адрес-ретранслятор.\n"+found.slice(0,3).join("\n");
    }else{
      out.textContent="✗ TURN не отвечает: ретранслятор не получен.\n"+
        (errs.length?"Ответы сервера:\n"+errs.slice(0,4).join("\n")+"\n(401 или 403 — неверные логин или пароль; 701 — сервер недоступен из вашей сети)":"Ошибок браузер не показал: вероятно, логин или пароль неверны, либо сервер недоступен.");
    }
  },8000);
}
function applySettings(k){
  var r=document.documentElement;
  if(ST.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",ST.theme);
  if(actx&&actx.state==="suspended") actx.resume();
  musicEnsure();musicApply();applyAudio();
  if((k==="desk"||k==="pad")&&G&&S.view==="game") render();
}
var wrap=document.getElementById("setwrap");
wrap.innerHTML=buildSettings();
document.getElementById("gear").addEventListener("click",function(){wrap.classList.add("open");syncSettingsUI();keys={};pad={};});
wrap.addEventListener("click",function(e){if(e.target===wrap||e.target.id==="setclose") wrap.classList.remove("open"); else if(e.target.id==="turntest") testTurn();});
function onSet(e){
  var el=e.target.closest&&e.target.closest("[data-set]"); if(!el) return;
  var k=el.getAttribute("data-set"), v;
  if(el.type==="checkbox") v=el.checked;
  else if(el.type==="range") v=(k==="speed")?Number(el.value):Number(el.value)/100;
  else v=el.value;
  ST[k]=v;saveST();applySettings(k);
}
wrap.addEventListener("input",onSet);
wrap.addEventListener("change",onSet);
document.addEventListener("keydown",function(e){if(e.code==="Escape") wrap.classList.remove("open");});
applySettings("init");



/* ---------- microphone badge ---------- */
var badge=document.createElement("div");
badge.id="micbadge";badge.setAttribute("role","button");badge.setAttribute("aria-label","Микрофон: нажмите, чтобы включить или выключить");
badge.innerHTML='<span class="mi">🎤</span><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><span class="mt"></span>';
document.body.appendChild(badge);
badge.addEventListener("click",function(){micOn=!micOn;applyAudio();if(S.view==="lobby") render();});
var micBuf=null, micHold=0, micShown="", BAR_K=[0.5,0.8,1,0.8,0.5];
setInterval(function(){
  var show=!!analyser&&(S.view==="lobby"||S.view==="intro"||S.view==="game"||S.view==="reveal");
  if(!show){badge.classList.remove("show");return;}
  if(!micBuf||micBuf.length!==analyser.fftSize) micBuf=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(micBuf);
  var sum=0,i;for(i=0;i<micBuf.length;i++){var v=(micBuf[i]-128)/128;sum+=v*v;}
  var lvl=Math.min(1,Math.sqrt(sum/micBuf.length)*5), now=Date.now();
  if(lvl>0.08) micHold=now+300;
  var game=restricted(), active=!!call&&call.state==="active", st, tx, ic="🎤";
  if(!micOn){st="off";tx="Микрофон выключен";ic="🔇";}
  else if(game&&!active){st="idle";tx="Вне звонка микрофон молчит";ic="🔇";}
  else if(now<micHold){st="speak";tx="Вы говорите";}
  else{st="live";tx="Микрофон включён";}
  var key=st+"|"+tx;
  if(key!==micShown){micShown=key;badge.className="show "+st;badge.querySelector(".mt").textContent=tx;badge.querySelector(".mi").textContent=ic;}
  var bars=badge.querySelectorAll(".bars i");
  for(i=0;i<bars.length;i++) bars[i].style.height=(st==="speak"?(4+lvl*16*BAR_K[i]):4).toFixed(1)+"px";
},80);

document.addEventListener("input",function(e){
  var el=e.target;
  if(G&&el&&el.getAttribute&&el.getAttribute("data-heard")==="1") G.draftText=el.value;
});
document.addEventListener("keydown",function(e){
  var el=e.target;
  if(e.key==="Enter"&&el&&el.getAttribute&&el.getAttribute("data-heard")==="1"){e.preventDefault();G.draftText=el.value;lockHeard();}
});
var KEYMAP={KeyW:"U",ArrowUp:"U",KeyS:"D",ArrowDown:"D",KeyA:"L",ArrowLeft:"L",KeyD:"R",ArrowRight:"R"};
document.addEventListener("keydown",function(e){
  if(!G||S.view!=="game"||wrap.classList.contains("open")) return;
  var tg=e.target&&e.target.tagName; if(tg==="SELECT"||tg==="INPUT"||tg==="TEXTAREA") return;
  var d=KEYMAP[e.code];
  if(d){keys[d]=true;e.preventDefault();}
  else if(e.code==="KeyE"&&!e.repeat){
    if(curMode().kind==="bear"){giveBear();return;}
    if(call&&call.state==="in"){answerCall();return;}
    if(call&&call.state!=="in"){S.note="Сначала закончите разговор.";render();return;}
    var nr=nearDesk();
    if(G.panel!=="none"&&!nr){G.panel="none";}
    else if(!nr){S.note="Подойдите к столу, чтобы взять телефон или блокнот.";render();return;}
    else G.panel=G.panel==="none"?"phone":(G.panel==="phone"?"book":"none");
    S.note="";render();
  }
});
document.addEventListener("keyup",function(e){var d=KEYMAP[e.code];if(d) keys[d]=false;});
window.addEventListener("blur",function(){keys={};pad={};});
document.addEventListener("pointerdown",function(e){
  var b=e.target.closest&&e.target.closest("[data-dir]");
  if(b){pad[b.getAttribute("data-dir")]=true;e.preventDefault();}
});
["pointerup","pointercancel"].forEach(function(ev){document.addEventListener(ev,function(){pad={};});});

render();
})();
</script>
</body>
</html>
